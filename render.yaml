services:
  - type: web
    name: dunu-platform
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: FEEXPAY_API_KEY
        sync: false
      - key: FEEXPAY_SHOP_ID
        sync: false
      - key: FEEXPAY_WEBHOOK_SECRET
        sync: false
      - key: DEFAULT_COMMISSION_RATE
        value: '10'
      - key: DEFAULT_DELIVERY_FEE
        value: '700'
      - key: COD_MINIMUM_BALANCE
        value: '1000'
